services:

  # ── miniERP Core ─────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minierp}
      POSTGRES_USER: ${POSTGRES_USER:-minierp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minierp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-minierp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-minierp}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@localhost}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD required}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:-}
      INTERNAL_PAPERLESS_TOKEN: ${INTERNAL_PAPERLESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - internal

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - internal

  # ── Paperless-ngx Dokumentenmanagement ──────────────────────────────────────
  # Web-UI: http://<server>:${PAPERLESS_PORT:-8001}
  # Ersteinrichtung: Admin-User anlegen, dann API-Token erzeugen → PAPERLESS_TOKEN in .env
  # Webhook: Paperless ruft nach jeder OCR-Verarbeitung automatisch miniERP an
  #          → neuer Eingangsrechnungs-Entwurf wird automatisch angelegt

  paperless-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - paperless_redis_data:/data
    networks:
      - internal

  paperless-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?PAPERLESS_DBPASS required}
    volumes:
      - paperless_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_started
    ports:
      - "${PAPERLESS_PORT:-8001}:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY required}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?PAPERLESS_ADMIN_PASSWORD required}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-admin@localhost}
      PAPERLESS_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8001}
      PAPERLESS_TIME_ZONE: ${TZ:-Europe/Berlin}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_OCR_MODE: skip_noarchive
      PAPERLESS_CONSUMER_POLLING: 60
      # Webhook: miniERP nach Dokumentenverarbeitung benachrichtigen
      PAPERLESS_POST_CONSUME_SCRIPT: /scripts/paperless-notify.sh
      MINIERP_URL: http://backend:8000
      MINIERP_INTERNAL_TOKEN: ${INTERNAL_PAPERLESS_TOKEN:-}
      MINIERP_TENANT_ID: ${PAPERLESS_DEFAULT_TENANT_ID:-1}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
      - ./scripts:/scripts:ro   # Notify-Script (schreibgeschützt)
    networks:
      - internal

  # ── Ollama (lokales LLM) ─────────────────────────────────────────────────────
  # Modell beim ersten Start laden:
  #   docker exec -it minierp-ollama-1 ollama pull llama3.2:3b
  # Aktive Nutzung: nur auf Nutzeranfrage (KI-Widget im Angebotseditor,
  #                 Strukturierung von Eingangsrechnungen) — kein Hintergrundprozess.
  # GPU-Support (NVIDIA, optional — Zeilen unten einkommentieren):
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal

  # ── Optionaler Dev-Server ─────────────────────────────────────────────────────
  # Starten mit: docker compose --profile dev up -d frontend-dev

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${DEV_PORT:-5173}:5173"
    networks:
      - internal
    profiles: ["dev"]

volumes:
  postgres_data:
  paperless_db_data:
  paperless_redis_data:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:
  ollama_data:

networks:
  internal:
    driver: bridge
